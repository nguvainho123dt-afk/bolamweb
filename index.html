<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7bfc8">
<title>bolamweb 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f7bec8; color: #fff; display: grid; place-items: center;
  }
  .page {
    width: 100%; min-height: 100svh; padding: 28px 18px 40px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 22px;
  }
  h1 {
    margin: 0; color: #f32636; font-size: clamp(22px, 5vw, 30px);
    line-height: 1.2; font-weight: 850; text-shadow: 0 3px 5px #b96770;
  }
  .subtitle {
    margin: 0; font-size: clamp(16px, 4vw, 20px); line-height: 1.35;
    font-weight: 800; text-shadow: 0 3px 6px #a77b82;
  }
  .cat { width: min(76vw, 340px); height: auto; filter: drop-shadow(0 4px 1px #d98e99); }
  .buttons { width: min(100%, 420px); display: flex; gap: 14px; justify-content: center; margin-top: 4px; }
  button {
    border: 0; border-radius: 18px; min-width: 0; flex: 1; padding: 17px 10px;
    font: 800 19px system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 6px 0 #b83d65, 0 10px 18px #c77c8a66;
    transition: transform .12s ease, left .15s ease, top .15s ease;
  }
  #yes { color: white; background: linear-gradient(#f6538c, #e9437b); }
  #no { color: #692b24; background: linear-gradient(#ffa0a0, #f47d80); box-shadow: 0 6px 0 #c96970, 0 10px 18px #c77c8a66; }
  button:active { transform: translateY(3px); }
  .success { display: none; gap: 18px; }
  .success h1 { color: #f32636; }
  .success .message { font-size: clamp(23px, 6vw, 34px); font-weight: 900; line-height: 1.35; text-shadow: 0 3px 5px #b96770; }
  .hearts { font-size: 44px; animation: bob 1.1s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-9px) rotate(5deg); } }
  @media (max-height: 650px) { .page { gap: 12px; padding: 16px; } .cat { width: min(48vw, 230px); } button { padding: 13px 8px; } }
</style>
</head>
<body>
<main class="page" id="question">
  <h1>LÀM BẠN GÁI ANH NHÉ<br>BẤY BÌ 💖</h1>
  <p class="subtitle">Em mà không trả lời hay thoát ra<br>là đồng ý rồi đó nha :3</p>
  <svg class="cat" viewBox="0 0 320 310" role="img" aria-label="Mèo dễ thương ôm trái tim">
    <!-- ears -->
    <path d="M48 100 L36 39 Q74 42 105 66 L215 66 Q246 42 284 39 L272 105" fill="#c9c0b9" stroke="#6d4935" stroke-width="7" stroke-linejoin="round"/>
    <path d="M52 53 L82 69 L55 81Z M268 53 L238 69 L265 81Z" fill="#ff8e91"/>
    <!-- body -->
    <path d="M73 155 Q63 92 119 70 Q160 52 201 70 Q257 91 252 158 L263 283 L74 283Z" fill="#c9c0b9" stroke="#6d4935" stroke-width="7" stroke-linejoin="round"/>
    <!-- face -->
    <ellipse cx="113" cy="153" rx="10" ry="13" fill="#59351f"/>
    <ellipse cx="207" cy="153" rx="10" ry="13" fill="#59351f"/>
    <ellipse cx="81" cy="174" rx="17" ry="10" fill="#ff918d"/>
    <ellipse cx="239" cy="174" rx="17" ry="10" fill="#ff918d"/>
    <path d="M151 163 Q160 171 169 163 Q167 184 160 184 Q153 183 151 163" fill="#f77e79" stroke="#6d4935" stroke-width="3"/>
    <path d="M160 185 Q151 197 143 187 M160 185 Q169 197 177 187" fill="none" stroke="#6d4935" stroke-width="3" stroke-linecap="round"/>
    <!-- heart bucket -->
    <g fill="#fa6468" stroke="#d7474f" stroke-width="4">
      <path d="M68 235 C38 209 57 184 78 199 C91 180 118 195 105 219 L82 241Z"/>
      <path d="M102 226 C76 198 99 177 119 192 C137 173 158 193 143 214 L117 239Z"/>
      <path d="M135 226 C111 199 134 179 153 194 C172 176 193 195 177 217 L151 240Z"/>
      <path d="M169 230 C145 204 168 184 188 199 C207 181 228 200 212 222 L185 243Z"/>
      <path d="M81 250 C55 225 78 206 97 221 C116 203 136 222 121 244 L96 263Z"/>
      <path d="M118 252 C93 226 115 207 135 222 C154 204 174 223 158 245 L133 265Z"/>
      <path d="M154 253 C130 227 152 208 172 223 C191 205 211 224 195 246 L169 266Z"/>
    </g>
    <path d="M46 239 Q160 256 273 239 L261 292 Q160 308 57 292Z" fill="#ffcf76" stroke="#6d4935" stroke-width="6"/>
    <path d="M47 240 Q160 256 273 240" fill="none" stroke="#fff0b5" stroke-width="8"/>
    <!-- paw holding heart -->
    <path d="M205 205 Q220 219 234 230 Q248 241 238 250 Q228 257 212 244 L192 225" fill="#c9c0b9" stroke="#6d4935" stroke-width="6" stroke-linecap="round"/>
    <path d="M147 201 C127 181 145 163 160 177 C176 160 194 179 178 198 L161 216Z" fill="#ff696d" stroke="#d7474f" stroke-width="4"/>
  </svg>
  <div class="buttons">
    <button id="yes">Vâng :3</button>
    <button id="no">Đéo :]</button>
  </div>
</main>
<main class="page success" id="success">
  <div class="hearts">💗 🐱 💗</div>
  <h1>BIẾT NGAY MÀAA!</h1>
  <div class="message">Tối nay đi học<br>cho anh sì tơ phát 🥹💖</div>
  <div class="hearts">💞 💘 💞</div>
</main>
<script>
  const no = document.getElementById('no');
  const yes = document.getElementById('yes');
  const question = document.getElementById('question');
  const success = document.getElementById('success');

  function moveNo() {
    // Đưa nút ra vị trí ngẫu nhiên trong màn hình và tách khỏi hàng nút.
    no.style.position = 'fixed';
    const margin = 12;
    const maxX = Math.max(margin, window.innerWidth - no.offsetWidth - margin);
    const maxY = Math.max(margin, window.innerHeight - no.offsetHeight - margin);
    no.style.left = (margin + Math.random() * (maxX - margin)) + 'px';
    no.style.top = (margin + Math.random() * (maxY - margin)) + 'px';
  }
  no.addEventListener('pointerenter', moveNo);
  no.addEventListener('pointerdown', (event) => { event.preventDefault(); moveNo(); });
  no.addEventListener('click', (event) => { event.preventDefault(); moveNo(); });
  no.addEventListener('touchstart', (event) => { event.preventDefault(); moveNo(); }, {passive:false});

  yes.addEventListener('click', () => {
    question.style.display = 'none';
    success.style.display = 'flex';
    document.title = 'Yêu rồi nha 💗';
    document.body.style.overflow = 'auto';
  });
</script>
</body>
</html>
